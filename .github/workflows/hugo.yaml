name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d # v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: hugo --minify

      # Blocks the deploy on structural SEO faults (missing canonical/og:image,
      # broken internal links, duplicate descriptions) — each is one config or
      # template edit. Per-page content issues are printed but do not fail;
      # run `python3 scripts/seo_check.py --strict` locally to see them fail.
      - name: SEO check
        run: python3 scripts/seo_check.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Notifies Bing/Naver/Yandex of today's changed URLs. Runs last because a
      # ping sent before the deploy finishes points crawlers at the old HTML.
      # Never fails the deploy — the site is already live at this point, and a
      # missed ping costs crawl latency, not correctness. Google does not
      # participate in IndexNow; see the script's docstring.
      - name: IndexNow ping
        run: python3 scripts/indexnow_ping.py
        continue-on-error: true
