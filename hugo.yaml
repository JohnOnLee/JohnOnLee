  home:
    - HTML
    - RSS
    - LLMS
  page:
    - HTML
    - LLMSFULL

params:
  description: "AI·스타트업 모닝 브리핑과 LLM, 코딩 에이전트에 대한 생각과 실험을 기록합니다."
  author: John Lee
  ShowReadingTime: false
  ShowRssButtonInSectionTermList: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  defaultTheme: auto
  DateFormat: "2006-01-02"

markup:
  goldmark:
    renderer:
      unsafe: true
