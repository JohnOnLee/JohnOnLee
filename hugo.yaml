languages:
  ko:
    label: 한국어
    weight: 1
    title: John on Lee
    params:
      homeInfoParams:
        Title: 👋 John on Lee
        Content: |
          생각과 실험을 기록하는 개인 사이트입니다.

          ### 📋 AI·스타트업 모닝 브리프
          Hermes Agent가 매일 아침 큐레이션하는 AI·스타트업 브리핑.
          핵심 변화, 미래 신호, 현실적인 기회까지 — 한눈에 정리합니다.
          → [브리프 보기](/brief/)
          
          ### ✍️ 블로그
          LLM, 코딩 에이전트, AI 스타트업에 대한 생각과 실험.
          → [블로그 읽기](/blog/)
    menu:
      main:
        - identifier: brief
          name: 모닝 브리프
          url: /brief/
          weight: 10
        - identifier: blog
          name: 블로그
          url: /blog/
          weight: 20
        - identifier: rss
          name: RSS
          url: /brief/index.xml
          weight: 30
