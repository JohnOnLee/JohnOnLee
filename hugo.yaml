    label: English
    weight: 2
    title: John on Lee
    params:
      homeInfoParams:
        Title: 👋 John on Lee
        Content: |
          A personal site for thoughts, experiments, and things worth sharing.

          ### 📋 AI / Startup Morning Brief
          AI/startup briefing curated daily by Hermes Agent.
          Key shifts, future signals, and grounded opportunities — all in one place.
          → [View briefs](/en/brief/)
          
          ### ✍️ Blog
          Thoughts and experiments on LLMs, coding agents, and AI startups.
          → [Read blog](/en/blog/)
    menu:
      main:
        - identifier: brief
          name: Morning Brief
          url: /brief/
          weight: 10
        - identifier: blog
          name: Blog
          url: /blog/
          weight: 20
        - identifier: rss
          name: RSS
          url: /en/brief/index.xml
          weight: 30

googleAnalytics: G-XQLLNDLGC0
enableRobotsTXT: true

outputFormats:
