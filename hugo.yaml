baseURL: https://john.onlee.io/
title: John on Lee
theme: PaperMod

defaultContentLanguage: ko
defaultContentLanguageInSubdir: false

languages:
  ko:
    label: 한국어
    languageCode: ko-KR
    weight: 1
    title: John on Lee
    params:
      description: "AI 뉴스가 빌더에게 무슨 뜻인지 짚는 AI 레이더, 그리고 LLM과 코딩 에이전트 사용기."
      footer:
        text: "[개인정보처리방침](/privacy/)"
    menu:
      main:
        - identifier: brief
          name: AI 레이더
          url: /brief/
          weight: 10
        - identifier: blog
          name: 인사이트
          url: /blog/
          weight: 20
        - identifier: guides
          name: 가이드 & 툴
          url: /guides/
          weight: 30
        - identifier: about
          name: About
          url: /about/
          weight: 40
        - identifier: rss
          name: RSS
          url: /brief/index.xml
          weight: 50
  en:
    label: English
    languageCode: en-US
    weight: 2
    title: John on Lee
    params:
      description: "AI Radar on what AI news means for builders, plus field notes on LLMs and coding agents from someone building with them."
      footer:
        text: "[Privacy Policy](/en/privacy/)"
    menu:
      main:
        - identifier: brief
          name: AI Radar
          url: /brief/
          weight: 10
        - identifier: blog
          name: Insights
          url: /blog/
          weight: 20
        - identifier: guides
          name: Guides & Tools
          url: /guides/
          weight: 30
        - identifier: about
          name: About
          url: /about/
          weight: 40
        - identifier: rss
          name: RSS
          url: /en/brief/index.xml
          weight: 50

googleAnalytics: G-XQLLNDLGC0
enableRobotsTXT: true
# Dates are KST. Hermes' morning brief is same-day in KST (it would be
# future-dated in UTC), and queued future posts appear on the first daily
# build after their date.
timeZone: Asia/Seoul
buildFuture: false

# Site-wide social share image. PaperMod only emits og:image/twitter:image
# from a page's `cover`, and the site has no inline images, so without this
# every share renders as a bare text card. `hidden: true` keeps the cover out
# of the rendered page — this exists for the meta tags only. A post that sets
# its own cover overrides this.
cascade:
  - params:
      cover:
        image: /og-default.png
        alt: "John on Lee"
        hidden: true

# Tags only (no categories). Fixed vocabulary, max 4 per post (mirrors
# Dev.to's cap): coding-agents, ai-memory, ai-economics, ai-business,
# writing-with-ai, site-building. Briefs are never tagged.
taxonomies:
  tag: tags

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - LLMS

params:
  adsenseClient: "ca-pub-5591251330042614"  # ownership meta site-wide; ad script loads on /guides/ only
  assets:
    favicon: "favicon.png"
    favicon16x16: "favicon.png"
    favicon32x32: "favicon.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"  # theme links this unconditionally; without the file it 404s on every page
  # Search engine ownership verification — paste each console's meta-tag content value:
  analytics:
    google:
      SiteVerificationTag: "DyTja2OHhIinFnrm0A29ExS_MpvuzOfDUpgv08U6ux4"
    # Bing needs no tag here: the site is verified in Bing Webmaster Tools
    # through the Google Search Console connection, not a meta tag. Only
    # uncomment this if that connection is ever removed.
    # bing:
    #   SiteVerificationTag: "..."
    naver:
      SiteVerificationTag: "beb6cc7f22d782ea0281dc35aaed8ba3bf432851"
  # Per-language overrides live under languages.*.params.description; this is
  # the fallback only. Without the overrides the English pages inherit Korean.
  description: "AI 뉴스가 빌더에게 무슨 뜻인지 짚는 AI 레이더, 그리고 LLM과 코딩 에이전트 사용기."
  author: John Lee
  ShowReadingTime: false
  ShowRssButtonInSectionTermList: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  defaultTheme: auto
  DateFormat: "2006-01-02"

markup:
  goldmark:
    renderer:
      unsafe: false  # raw HTML in markdown is dropped; trusted HTML lives in shortcodes
